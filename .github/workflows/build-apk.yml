name: Build Android Debug APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Write Project Files from Payload
        env:
          RAW_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const raw = process.env.RAW_PAYLOAD;
            if (!raw) {
              console.log("No payload found!");
              process.exit(0);
            }
            try {
              const payload = JSON.parse(raw);
              const files = payload.files || [];
              console.log("Found " + files.length + " files in payload.");
              files.forEach(f => {
                const target = path.resolve(f.path);
                fs.mkdirSync(path.dirname(target), { recursive: true });
                fs.writeFileSync(target, f.content, "utf8");
                console.log("Written: " + f.path);
              });
            } catch (err) {
              console.error("Payload parse error: " + err.message);
            }
          '

      - name: Configure Root & App Gradle Build Scripts
        run: |
          # 1. AndroidX പ്രവർത്തനക്ഷമമാക്കാൻ gradle.properties ഫയൽ നിർബന്ധമായും ഉണ്ടാക്കുന്നു
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. റൂട്ട് build.gradle.kts ക്രമീകരിക്കുന്നു
          cat << 'EOF' > build.gradle.kts
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.android) apply false
              alias(libs.plugins.kotlin.compose) apply false
          }
          EOF

          # 3. app/build.gradle.kts ഉണ്ടെന്ന് ഉറപ്പാക്കുന്നു
          mkdir -p app
          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "Creating fallback app/build.gradle.kts..."
            cat << 'EOF' > app/build.gradle.kts
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.kotlin.compose)
          }

          android {
              namespace = "com.example.counterapp"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.counterapp"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.lifecycle.runtime.ktx)
              implementation(libs.androidx.activity.compose)
              implementation(platform(libs.androidx.compose.bom))
              implementation(libs.androidx.ui)
              implementation(libs.androidx.ui.graphics)
              implementation(libs.androidx.ui.tooling.preview)
              implementation(libs.androidx.material3)
          }
          EOF
          fi

          # 4. Wrapper നിർമ്മിക്കുന്നു
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
