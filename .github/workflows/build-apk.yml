name: Build Android Debug APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Write Project Files from Payload
        env:
          RAW_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const raw = process.env.RAW_PAYLOAD;
            if (!raw) {
              console.log("No payload found!");
              process.exit(0);
            }
            try {
              const payload = JSON.parse(raw);
              const files = payload.files || [];
              console.log("Found " + files.length + " files in payload.");
              files.forEach(f => {
                const target = path.resolve(f.path);
                fs.mkdirSync(path.dirname(target), { recursive: true });
                fs.writeFileSync(target, f.content, "utf8");
                console.log("Written: " + f.path);
              });
            } catch (err) {
              console.error("Payload parse error: " + err.message);
            }
          '

      - name: Build Debug APK with System Gradle
        run: |
          echo "Listing current files:"
          ls -la
          
          # Root build file ഇല്ലെങ്കിൽ ബിൽഡ് ഫെയിൽ ആകും, അത് പരിശോധിക്കുന്നു
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "Error: No root build.gradle found in project files!"
            exit 1
          fi

          # Wrapper ഉണ്ടെങ്കിൽ അത് ഉപയോഗിക്കുക, ഇല്ലെങ്കിൽ ഇൻസ്റ്റാൾ ചെയ്യുക
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi

          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
