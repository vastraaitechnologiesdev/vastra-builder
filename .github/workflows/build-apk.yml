name: Build Android Debug APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK Licenses & Install API 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Write & Sanitize Project Files from Payload
        env:
          RAW_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const raw = process.env.RAW_PAYLOAD;
            if (!raw) {
              console.log("No payload found!");
              process.exit(0);
            }
            try {
              const payload = JSON.parse(raw);
              const files = payload.files || [];
              console.log("Found " + files.length + " files in payload.");
              
              let detectedPackage = "com.vastra.app";

              files.forEach(f => {
                const target = path.resolve(f.path);
                fs.mkdirSync(path.dirname(target), { recursive: true });
                
                let content = f.content || "";
                if (typeof content === "string") {
                  content = content.replace(/\\n/g, "\n").replace(/\\r/g, "\r").replace(/\\t/g, "\t");
                  content = content.replace(/^```[a-zA-Z]*\r?\n/, "").replace(/\r?\n```$/, "").trim();
                  
                  // AGP 8+ മാനിഫെസ്റ്റ് ഫിക്സ്: package="..." ഒഴിവാക്കുന്നു
                  if (f.path.includes("AndroidManifest.xml")) {
                    const match = content.match(/package\s*=\s*["'"']([^"'"']+)["'"']/);
                    if (match && match[1]) {
                      detectedPackage = match[1];
                    }
                    content = content.replace(/\s*package\s*=\s*["'"'][^"'"']+["'"']/, "");
                  }

                  if (f.path.endsWith(".kt")) {
                    const pkgIndex = content.indexOf("package ");
                    if (pkgIndex > 0) {
                      content = content.substring(pkgIndex);
                    }
                  }
                }
                
                fs.writeFileSync(target, content, "utf8");
                console.log("Cleaned and Written: " + f.path);
              });

              // കണ്ടെത്തിയ പാക്കേജ് പേര് എൻവയോൺമെന്റിലേക്ക് സേവ് ചെയ്യുന്നു
              fs.writeFileSync("detected_package.txt", detectedPackage, "utf8");
            } catch (err) {
              console.error("Payload parse error: " + err.message);
            }
          '

      - name: Configure Universal Gradle & Manifest
        run: |
          # പാക്കേജ് നെയിം റീഡ് ചെയ്യുന്നു
          PKG_NAME="com.vastra.app"
          if [ -f "detected_package.txt" ]; then
            PKG_NAME=$(cat detected_package.txt)
          fi
          echo "Using package namespace: $PKG_NAME"

          # 1. AndroidX സെറ്റിങ്സ്
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VastraApp"
          include(":app")
          EOF

          # 3. റൂട്ട് build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          # 4. Fallback strings.xml
          mkdir -p app/src/main/res/values
          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">V Astra App</string>
          </resources>
          EOF
          fi

          # 5. app/build.gradle.kts (ഡൈനാമിക് നേംസ്പേസും വിപുലമായ ലൈബ്രറികളും അടങ്ങിയ യൂണിവേഴ്സൽ സ്ക്രിപ്റ്റ്)
          mkdir -p app
          cat << EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "$PKG_NAME"
              compileSdk = 35

              defaultConfig {
                  applicationId = "$PKG_NAME"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.11.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          # 6. Wrapper ഉറപ്പാക്കുന്നു
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
