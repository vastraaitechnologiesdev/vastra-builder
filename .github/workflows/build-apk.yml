name: Build Android Debug APK

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Write Project Files from Payload
        run: |
          echo "Decoding incoming project files..."
          cat << 'EOF' > parse_files.js
          const fs = require('fs');
          const path = require('path');
          
          try {
            const payload = JSON.parse(process.env.PAYLOAD || '{}');
            const files = payload.files || [];
            
            files.forEach(file => {
              const fullPath = path.resolve(file.path);
              fs.mkdirSync(path.dirname(fullPath), { recursive: true });
              fs.writeFileSync(fullPath, file.content, 'utf8');
              console.log(`Created: ${file.path}`);
            });
          } catch (e) {
            console.log("No custom files payload or parse error:", e.message);
          }
          EOF
          
          PAYLOAD='${{ toJson(github.event.client_payload) }}' node parse_files.js

      - name: Setup Gradle 8.7 Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Setting up Gradle 8.7 Wrapper directly..."
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O gradle-bin.zip
            unzip -q gradle-bin.zip
            ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
            rm -rf gradle-bin.zip gradle-8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
